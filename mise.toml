[env]
# 전역 xcode-select는 iPadOS SDK가 없는 Command Line Tools를 가리키므로, 이 저장소에서만 Xcode 툴체인을 쓴다.
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"
FOLIO_DERIVED_DATA = "{{config_root}}/.build/DerivedData"

[tools]
xcodegen = "2.46.0"
swiftlint = "0.65.1"
lefthook = "2.2.2"
periphery = "3.8.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"

# folio-lint는 Tectonic이 필요 없지만, SwiftPM은 Package.swift를 읽을 때마다 바이너리 타깃 폴더를 확인한다. 그래서 Swift 패키지를
# 읽는 모든 작업이 이 작업에 의존한다.
[tasks.tectonic]
description = "Fetch Tectonic as a static library (FolioTectonic.xcframework) pinned in sources/tectonic/pin.json, checked by sha256"
run = "sources/tectonic/fetch.sh"

# 여러 줄이거나 조건이 있는 작업은 .mise/tasks의 파일 작업이다. 버전과 릴리스 노트는 Swift 도구 folio-dev(sources/dev)가 맡는다.
[tasks.version-bump]
description = "Raise the version in FolioVersion: mise run version-bump -- major|minor|patch"
depends = ["tectonic"]
run = "swift run -q folio-dev version bump"

[tasks.release-notes]
description = "Print the next release's body from the patch notes of the PRs merged since the last tag: mise run release-notes [-- <since>]"
depends = ["tectonic"]
run = "swift run -q folio-dev release-notes preview"

[tasks.release-tag]
description = "Tag origin/main as v<version> and push the tag, which drafts its GitHub release"
depends = ["tectonic"]
run = "swift run -q folio-dev version tag"

[tasks.test]
description = "Run package tests, folio-lint (code, design and Application Support rules), SwiftLint, the swift-format check and the shell checks"
depends = ["tectonic", "shell-check"]
# 픽스처와 기대값은 한국 시각 기준이다. Apple의 날짜 인식기는 `내일 7시` 같은 말을 테스트 달력이 아니라 기기의 시간대로
# 읽으므로, UTC인 기기(CI)에서는 테스트가 실패한다.
env = { TZ = "Asia/Seoul" }
# 빌드가 필요 없는 SwiftLint와 swift-format 검사를 먼저 돌려, 형식 오류가 빌드와 테스트를 기다리지 않고 실패하게 한다.
run = [
  "swiftlint lint --quiet --strict --baseline .swiftlint-baseline.json",
  "scripts/swift-format.sh lint",
  "swift build --build-tests",
  "swift test --skip-build",
  "swift run --skip-build -q folio actions --check",
  "swift run --skip-build -q folio-gen --check",
  # debug로 빌드한 swift-syntax는 코드 전체를 읽는 데 20초쯤, release는 2초쯤 걸린다. release로 모든 모듈을 빌드하면 코드를
  # 다시 컴파일하므로 folio-lint만 빌드한다(check-code와 같은 빌드를 함께 쓴다).
  "swift build -q -c release --product folio-lint",
  "swift run -q -c release --skip-build folio-lint",
]

[tasks.check-code]
description = "Fail on the screen, string, layer, comment, design and Application Support rules a syntax tree can see, past the places in .folio-lint-baseline.txt; -- --update rewrites it"
depends = ["tectonic"]
run = [
  "swift build -q -c release --product folio-lint",
  "swift run -q -c release --skip-build folio-lint",
]

[tasks.swiftlint]
description = "Run SwiftLint (.swiftlint.yml) past the places in .swiftlint-baseline.json"
run = "swiftlint lint --quiet --strict --baseline .swiftlint-baseline.json"

[tasks.swiftlint-baseline]
description = "Rewrite .swiftlint-baseline.json from what SwiftLint finds now: only to drop fixed places or follow moved ones"
# SwiftLint는 찾은 것이 있으면 0이 아닌 값으로 끝나는데, 기준선은 바로 그 결과로 쓴다.
run = "swiftlint lint --quiet --write-baseline .swiftlint-baseline.json > /dev/null || true"

[tasks.lint]
description = "Run folio-lint, SwiftLint, the swift-format check and the shell checks"
depends = ["check-code", "swiftlint", "format-check", "shell-check"]

# .swift-format은 Folio의 코드 문체를 되돌리는 규칙을 끈다. 끈 규칙은 한 줄에 여러 문장이나 선언을 쓰는 것(`{ a(); b() }`,
# `let x = 1, y = 2`, `case a, b`), `private extension`, `case let (a?, b?)`, `return x += 1`, `.forEach`, 후행 클로저 여러 개,
# 대문자로 시작하는 DSL 함수(sources/domain/shared/core/model)를 막는 규칙이다. Folio는 문서 주석을 거의 쓰지 않으므로 문서 주석
# 규칙도 끈다.
[tasks.format]
description = "Format the Swift sources in place with swift-format (.swift-format)"
run = "scripts/swift-format.sh format"

[tasks.format-check]
description = "Fail on Swift sources swift-format (.swift-format) would change: mise run format fixes them"
run = "scripts/swift-format.sh lint"

[tasks.periphery]
description = "List code nothing uses, from a Mac build (.periphery.yml)"
depends = ["generate"]
run = "periphery scan --quiet"

[tasks.hooks]
description = "Install the git hooks in lefthook.yml (swift-format, SwiftLint, folio-lint and the shell checks before each commit)"
run = "lefthook install"

[tasks.gen-cli]
description = "Write the action list (sources/actions/generated) and the CLI commands and command tree (sources/cli/generated) from the @Action declarations"
depends = ["tectonic"]
# folio-gen은 링크한 액션 목록으로 명령을 쓴다. 새 액션은 첫 실행이 목록을 고친 뒤에야 링크되므로 두 번 돌린다.
run = ["swift run -q folio-gen", "swift run -q folio-gen"]

[tasks.fixture]
description = "Write a fake GIST folder to run the app or the CLI on: mise run fixture -- <folder> [standard|legacy|busyDay|manyExams|quietDay|empty]"
depends = ["tectonic"]
run = "swift run -q folio-fixture"

[tasks.cli]
description = "Run the folio CLI"
depends = ["tectonic"]
run = "swift run folio"

# FolioActions는 로컬 FolioMacros 타깃의 매크로를 쓰는데, -skipMacroValidation이 없으면 xcodebuild가 신뢰할지 묻고 멈출 수 있다.
[tasks.build-mac]
description = "Build the app for macOS"
depends = ["generate"]
run = "xcodebuild -scheme Folio -destination 'platform=macOS' build -quiet -derivedDataPath \"$FOLIO_DERIVED_DATA\" -skipMacroValidation"

[tasks.build-release]
description = "Build the Release app for macOS into .build/DerivedData/Build/Products/Release"
depends = ["generate"]
run = "xcodebuild -scheme Folio -configuration Release -destination 'platform=macOS' build -quiet -derivedDataPath \"$FOLIO_DERIVED_DATA\" -skipMacroValidation"

[tasks.build-ipad]
description = "Build the app for the iPad simulator (FOLIO_CONFIGURATION=Release for a Release build)"
depends = ["generate"]
# generic destination은 Debug가 아니면 모든 시뮬레이터 아키텍처를 빌드한다. Intel용은 같은 코드를 한 번 더 컴파일할 뿐이고
# iPad에서 쓰이지 않으므로 ARCHS=arm64로 줄인다.
run = "xcodebuild -scheme Folio -configuration \"${FOLIO_CONFIGURATION:-Debug}\" -destination 'generic/platform=iOS Simulator' ARCHS=arm64 build -quiet -derivedDataPath \"$FOLIO_DERIVED_DATA\" -skipMacroValidation $FOLIO_XCODEBUILD_FLAGS"

[tasks.build-web]
description = "Bundle the note page (KaTeX math, code highlighting, diagrams, note CSS) and the edit view's code highlighting into sources/app/resources/web"
dir = "sources/web"
run = ["npm ci --ignore-scripts --no-audit --no-fund", "npm run build"]
