[env]
# Use Xcode's toolchain in this repo only; the global xcode-select points at Command Line Tools,
# which has no iPadOS SDK.
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"
# Every xcodebuild builds into the checkout instead of ~/Library/Developer/Xcode/DerivedData, whose folder is keyed
# by the project path: each agent worktree would leave a few GB there that nothing reuses once the worktree is gone.
FOLIO_DERIVED_DATA = "{{config_root}}/.build/DerivedData"

[tools]
xcodegen = "2.46.0"
swiftlint = "0.65.1"
lefthook = "2.2.2"
periphery = "3.8.0"

[tasks.generate]
description = "Generate Folio.xcodeproj from project.yml, with the version and build number"
depends = ["tectonic"]
run = ["scripts/version.sh xcconfig", "xcodegen generate"]

# Every build of FolioStorage links Tectonic, so every task that builds it depends on this one. folio-lint needs no Tectonic,
# but SwiftPM reads the binary target's folder whenever it loads Package.swift.
[tasks.tectonic]
description = "Fetch Tectonic as a static library (FolioTectonic.xcframework) pinned in sources/tectonic/pin.json, checked by sha256"
run = "sources/tectonic/fetch.sh"

[tasks.version-bump]
description = "Raise the version in FolioVersion: mise run version-bump -- major|minor|patch"
run = "scripts/version.sh bump"

[tasks.release-notes]
description = "Print the next release's body from the patch notes of the PRs merged since the last tag: mise run release-notes [-- <since>]"
run = "scripts/release-notes.sh preview"

[tasks.release-tag]
description = "Tag origin/main as v<version> and push the tag, which drafts its GitHub release"
run = "scripts/version.sh tag"

[tasks.test]
description = "Run package tests, folio-lint (code, design and Application Support rules), SwiftLint and the swift-format check"
depends = ["tectonic"]
# fixtures and expectations are in Korean time, and Apple's date detector reads phrases like 내일 7시 in the
# machine's zone, not the test calendar's; a UTC machine (CI) would fail them.
env = { TZ = "Asia/Seoul" }
# The package is built once with its tests: `swift run` alone builds without testability and so compiles every module
# again for the checks.
run = [
  "swift build --build-tests",
  "swift test --skip-build",
  "swift run --skip-build -q folio actions --check",
  "swift run --skip-build -q folio-gen --check",
  # Release: debug swift-syntax takes some 20 seconds to parse the codebase, release two. Only folio-lint is built
  # (as in check-code, so the two share it): every module in release would compile the codebase again.
  "swift build -q -c release --product folio-lint",
  "swift run -q -c release --skip-build folio-lint",
  "swiftlint lint --quiet --strict --baseline .swiftlint-baseline.json",
  "scripts/swift-format.sh lint",
]

[tasks.check-code]
description = "Fail on the screen, string, layer, comment, design and Application Support rules a syntax tree can see, past the places in .folio-lint-baseline.txt; -- --update rewrites it"
depends = ["tectonic"]
run = [
  "swift build -q -c release --product folio-lint",
  "swift run -q -c release --skip-build folio-lint",
]

[tasks.swiftlint]
description = "Run SwiftLint (.swiftlint.yml) past the places in .swiftlint-baseline.json"
run = "swiftlint lint --quiet --strict --baseline .swiftlint-baseline.json"

[tasks.swiftlint-baseline]
description = "Rewrite .swiftlint-baseline.json from what SwiftLint finds now: only to drop fixed places or follow moved ones"
# SwiftLint exits non-zero when it finds anything, which is what a baseline is written from.
run = "swiftlint lint --quiet --write-baseline .swiftlint-baseline.json > /dev/null || true"

[tasks.lint]
description = "Run folio-lint, SwiftLint and the swift-format check"
depends = ["check-code", "swiftlint", "format-check"]

# The swift-format in Xcode's toolchain (DEVELOPER_DIR above), so it needs no install. .swift-format turns off the
# rules that would undo how Folio writes code: several statements or declarations on one line (`{ a(); b() }`,
# `let x = 1, y = 2`, `case a, b`), `private extension`, `case let (a?, b?)`, `return x += 1`, `.forEach`, more than one
# trailing closure, and uppercase DSL functions (sources/domain's model.swift). Doc comments aren't required or checked,
# as Folio writes few.
[tasks.format]
description = "Format the Swift sources in place with swift-format (.swift-format)"
run = "scripts/swift-format.sh format"

[tasks.format-check]
description = "Fail on Swift sources swift-format (.swift-format) would change: mise run format fixes them"
run = "scripts/swift-format.sh lint"

[tasks.analyze]
description = "Run SwiftLint's analyzer rules (unused imports and declarations) on a clean Mac build's compiler log"
depends = ["generate"]
# The analyzer reads the compiler's command for each file, so an incremental build would leave unchanged files out.
run = [
  "mkdir -p .build",
  "xcodebuild -scheme Folio -destination 'platform=macOS' clean build -derivedDataPath \"$FOLIO_DERIVED_DATA\" -skipMacroValidation > .build/xcodebuild.log",
  "swiftlint analyze --quiet --compiler-log-path .build/xcodebuild.log",
]

[tasks.periphery]
description = "List code nothing uses, from a Mac build (.periphery.yml)"
depends = ["generate"]
run = "periphery scan --quiet"

[tasks.hooks]
description = "Install the git hooks in lefthook.yml (swift-format, SwiftLint and folio-lint before each commit)"
run = "lefthook install"

[tasks.gen-cli]
description = "Write the CLI commands of the actions declared with @Action (sources/cli/generated)"
depends = ["tectonic"]
run = "swift run -q folio-gen"

[tasks.fixture]
description = "Write a fake GIST folder to run the app or the CLI on: mise run fixture -- <folder> [standard|legacy|busyDay|manyExams|quietDay|empty]"
depends = ["tectonic"]
run = "swift run -q folio-fixture"

[tasks.cli]
description = "Run the folio CLI"
depends = ["tectonic"]
run = "swift run folio"

[tasks.install-cli]
description = "Build folio in release mode into ~/.local/lib/folio, linked from ~/.local/bin, with its zsh completion"
depends = ["tectonic"]
run = [
  "swift build -c release --product folio",
  # The string catalogs ship as resource bundles that must sit beside the binary, so both go in their own folder.
  "rm -rf ~/.local/lib/folio && mkdir -p ~/.local/lib/folio ~/.local/bin",
  "install -m 755 .build/release/folio ~/.local/lib/folio/folio",
  "cp -R .build/release/*.bundle ~/.local/lib/folio/",
  "ln -sf ~/.local/lib/folio/folio ~/.local/bin/folio",
  # zsh picks completions up from this fpath folder; other shells: folio completion bash|fish
  "mkdir -p ~/.local/share/zsh/site-functions",
  "~/.local/bin/folio completion zsh > ~/.local/share/zsh/site-functions/_folio",
]

# -skipMacroValidation: FolioActions uses macros from the local FolioMacros target, which xcodebuild would
# otherwise ask to trust interactively.
[tasks.build-mac]
description = "Build the app for macOS"
depends = ["generate"]
run = "xcodebuild -scheme Folio -destination 'platform=macOS' build -quiet -derivedDataPath \"$FOLIO_DERIVED_DATA\" -skipMacroValidation"

[tasks.test-app]
description = "Run the app's tests on macOS: screen models, and the note views against their reference screens"
depends = ["generate"]
# xcodebuild passes TEST_RUNNER_-prefixed variables to the tests without the prefix. A note-view picture that is missing
# or differs from its reference lands in FOLIO_NOTE_SCREENS; FOLIO_NOTE_SCREENS_STRICT fails a run on a macOS other than
# the one the references were made on, instead of skipping the comparison (CI sets it). FOLIO_TEST_PART=notes runs only
# the slow note-view suites and FOLIO_TEST_PART=rest everything else, so CI can run the halves side by side; a new
# suite lands in rest until it is listed here.
run = """
notes="NoteScreenTests NoteLayoutTests NoteClickGridTests NoteHangulTests NoteMathTests NoteTypingTests"
case "${FOLIO_TEST_PART:-}" in
  "") part="" ;;
  notes) part=$(for s in $notes; do printf ' -only-testing:FolioTests/%s' "$s"; done) ;;
  rest) part=$(for s in $notes; do printf ' -skip-testing:FolioTests/%s' "$s"; done) ;;
  *) echo "FOLIO_TEST_PART is notes or rest, not $FOLIO_TEST_PART" >&2; exit 2 ;;
esac
out="${FOLIO_NOTE_SCREENS:-.build/note-screens}"
case "$out" in /*) ;; *) out="$PWD/$out" ;; esac
# Only the pictures a run leaves: FOLIO_NOTE_SCREENS may name a folder that holds other files.
if [ -d "$out" ]; then find "$out" -maxdepth 1 -type f -name '*.png' -delete; rm -f "$out/machine.txt"; fi
rm -rf .build/test-app.xcresult
status=0
TEST_RUNNER_FOLIO_NOTE_SCREENS="$out" TEST_RUNNER_FOLIO_NOTE_SCREENS_STRICT="${FOLIO_NOTE_SCREENS_STRICT:-}" \
xcodebuild -scheme Folio -destination 'platform=macOS' -resultBundlePath .build/test-app.xcresult test -quiet -derivedDataPath "$FOLIO_DERIVED_DATA" -skipMacroValidation $part $FOLIO_XCODEBUILD_FLAGS || status=$?
# -quiet leaves out why a test failed; the summary has each failure's message.
if [ "$status" -ne 0 ] && [ -d .build/test-app.xcresult ]; then
  xcrun xcresulttool get test-results summary --path .build/test-app.xcresult --compact
fi
exit "$status"
"""

[tasks.test-a11y]
description = "Audit the main screens with performAccessibilityAudit: UI tests that take the screen and keyboard, so CI runs them"
depends = ["generate"]
# The summary is printed whether the run passed or not: each finding is a failure message there, and a passing run
# shows that the screens were visited.
run = """
rm -rf .build/test-a11y.xcresult
status=0
xcodebuild -scheme FolioE2ETests -destination 'platform=macOS' -resultBundlePath .build/test-a11y.xcresult test -quiet -derivedDataPath "$FOLIO_DERIVED_DATA" -skipMacroValidation -testLanguage ko -testRegion KR $FOLIO_XCODEBUILD_FLAGS || status=$?
if [ -d .build/test-a11y.xcresult ]; then
  xcrun xcresulttool get test-results summary --path .build/test-a11y.xcresult --compact
fi
exit "$status"
"""

[tasks.test-ipad]
description = "Run the iPad tests (Hangul in the edit view) on the first available iPad simulator"
depends = ["generate"]
run = """
id=$(xcrun simctl list devices available | grep -m1 -E '^ +iPad' | grep -oE '[0-9A-F-]{36}')
[ -n "$id" ] || { echo "no available iPad simulator" >&2; exit 1; }
rm -rf .build/test-ipad.xcresult
xcodebuild -scheme Folio -destination "platform=iOS Simulator,id=$id" -resultBundlePath .build/test-ipad.xcresult test -quiet -derivedDataPath "$FOLIO_DERIVED_DATA" -skipMacroValidation $FOLIO_XCODEBUILD_FLAGS
# -quiet leaves out the tests themselves; the count shows they ran.
xcrun xcresulttool get test-results summary --path .build/test-ipad.xcresult --compact
"""

[tasks.note-screens]
description = "Take the note-view pictures a CI run left as the new references: mise run note-screens -- <run ID>"
run = "scripts/note-screens.sh"

[tasks.render]
description = "Draw every page and sheet for each fixture scenario into FOLIO_RENDER_DIR (default .build/renders), with no window on screen"
depends = ["generate"]
# xcodebuild passes TEST_RUNNER_-prefixed variables to the tests without the prefix. Korean time and language keep the
# scenarios' class times and dates the same on any machine. FOLIO_RENDER_SIZES, _SCREENS and _SCENARIOS narrow a run.
run = """
dir="${FOLIO_RENDER_DIR:-.build/renders}"
case "$dir" in /*) ;; *) dir="$PWD/$dir" ;; esac
TEST_RUNNER_FOLIO_RENDER_DIR="$dir" TEST_RUNNER_TZ=Asia/Seoul \
TEST_RUNNER_FOLIO_RENDER_SIZES="${FOLIO_RENDER_SIZES:-}" TEST_RUNNER_FOLIO_RENDER_SCREENS="${FOLIO_RENDER_SCREENS:-}" \
TEST_RUNNER_FOLIO_RENDER_SCENARIOS="${FOLIO_RENDER_SCENARIOS:-}" \
xcodebuild -scheme Folio -destination 'platform=macOS,arch=arm64' test -quiet -derivedDataPath "$FOLIO_DERIVED_DATA" -skipMacroValidation \
  -only-testing:FolioTests/ScreenRenders -testLanguage ko -testRegion KR
echo "$dir"
"""

[tasks.build-release]
description = "Build the Release app for macOS into .build/DerivedData/Build/Products/Release"
depends = ["generate"]
run = "xcodebuild -scheme Folio -configuration Release -destination 'platform=macOS' build -quiet -derivedDataPath \"$FOLIO_DERIVED_DATA\" -skipMacroValidation"

[tasks.install-mac]
description = "Build this checkout's Release app and install it to /Applications"
depends = ["build-release"]
# Only the installed copy is stopped: a Debug build running from DerivedData shares the bundle ID, so quitting by
# name or ID would take it down too. It is stopped before the copy so the bundle is replaced whole.
run = """
installed='^/Applications/Folio[.]app/Contents/MacOS/Folio( |$)'
if pkill -f "$installed"; then
  for _ in $(seq 50); do pgrep -f "$installed" >/dev/null || break; sleep 0.2; done
fi
# The app was Coursebook.app before it was renamed; the old copy goes so only one remains.
rm -rf /Applications/Coursebook.app /Applications/Folio.app
ditto "$FOLIO_DERIVED_DATA/Build/Products/Release/Folio.app" /Applications/Folio.app
"""

[tasks.install-release]
description = "Install origin/main (or a given ref) as the app and the CLI, built in a clean temporary worktree: mise run install-release [-- <ref>]"
run = "scripts/install-release.sh"

[tasks.build-ipad]
description = "Build the app for the iPad simulator (FOLIO_CONFIGURATION=Release for a Release build)"
depends = ["generate"]
# A generic destination builds every simulator architecture outside Debug; Intel's adds a second full compile of the
# same code and nothing an iPad runs.
run = "xcodebuild -scheme Folio -configuration \"${FOLIO_CONFIGURATION:-Debug}\" -destination 'generic/platform=iOS Simulator' ARCHS=arm64 build -quiet -derivedDataPath \"$FOLIO_DERIVED_DATA\" -skipMacroValidation $FOLIO_XCODEBUILD_FLAGS"

[tasks.build-web]
description = "Bundle the note page (KaTeX math, code highlighting, diagrams, note CSS) and the edit view's code highlighting into sources/app/resources/web"
dir = "sources/web"
run = ["npm ci --ignore-scripts --no-audit --no-fund", "npm run build"]
