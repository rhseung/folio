[env]
# Use Xcode's toolchain in this repo only; the global xcode-select points at Command Line Tools,
# which has no iPadOS SDK.
DEVELOPER_DIR = "/Applications/Xcode.app/Contents/Developer"

[tools]
xcodegen = "2.46.0"

[tasks.generate]
description = "Generate Folio.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.test]
description = "Run package tests and the design token check"
# fixtures and expectations are in Korean time, and Apple's date detector reads phrases like 내일 7시 in the
# machine's zone, not the test calendar's; a UTC machine (CI) would fail them.
env = { TZ = "Asia/Seoul" }
run = [
  "swift test --package-path packages/folio-markdown",
  "swift test --package-path packages/folio-core",
  "swift test --package-path packages/folio-ai",
  "swift run -q --package-path packages/folio-core folio actions --check",
  "swift run -q --package-path packages/folio-core folio-gen --check",
  "scripts/check-design.sh",
]

[tasks.check-design]
description = "Fail on type sizes, colors or radii in screens that skip Theme"
run = "scripts/check-design.sh"

[tasks.gen-cli]
description = "Write the CLI commands of the actions declared with @Action (sources/folio-cli/generated)"
run = "swift run -q --package-path packages/folio-core folio-gen"

[tasks.fixture]
description = "Write a fake GIST folder to run the app or the CLI on: mise run fixture -- <folder> [standard|legacy]"
run = "swift run -q --package-path packages/folio-core folio-fixture"

[tasks.cli]
description = "Run the folio CLI"
run = "swift run --package-path packages/folio-core folio"

[tasks.install-cli]
description = "Build folio in release mode into ~/.local/lib/folio, linked from ~/.local/bin, with its zsh completion"
run = [
  "swift build -c release --package-path packages/folio-core --product folio",
  # The string catalogs ship as resource bundles that must sit beside the binary, so both go in their own folder.
  "rm -rf ~/.local/lib/folio && mkdir -p ~/.local/lib/folio ~/.local/bin",
  "install -m 755 packages/folio-core/.build/release/folio ~/.local/lib/folio/folio",
  "cp -R packages/folio-core/.build/release/*.bundle ~/.local/lib/folio/",
  "ln -sf ~/.local/lib/folio/folio ~/.local/bin/folio",
  # zsh picks completions up from this fpath folder; other shells: folio completion bash|fish
  "mkdir -p ~/.local/share/zsh/site-functions",
  "~/.local/bin/folio completion zsh > ~/.local/share/zsh/site-functions/_folio",
]

# -skipMacroValidation: FolioActions uses macros from the local FolioMacros target, which xcodebuild would
# otherwise ask to trust interactively.
[tasks.build-mac]
description = "Build the app for macOS"
depends = ["generate"]
run = "xcodebuild -scheme Folio -destination 'platform=macOS' build -quiet -skipMacroValidation"

[tasks.test-app]
description = "Run the app's screen-model tests on macOS"
depends = ["generate"]
run = "xcodebuild -scheme Folio -destination 'platform=macOS' test -quiet -skipMacroValidation"

[tasks.render]
description = "Draw every page and sheet for each fixture scenario into FOLIO_RENDER_DIR (default .build/renders), with no window on screen"
depends = ["generate"]
# xcodebuild passes TEST_RUNNER_-prefixed variables to the tests without the prefix. Korean time and language keep the
# scenarios' class times and dates the same on any machine. FOLIO_RENDER_SIZES, _SCREENS and _SCENARIOS narrow a run.
run = """
dir="${FOLIO_RENDER_DIR:-.build/renders}"
case "$dir" in /*) ;; *) dir="$PWD/$dir" ;; esac
TEST_RUNNER_FOLIO_RENDER_DIR="$dir" TEST_RUNNER_TZ=Asia/Seoul \
TEST_RUNNER_FOLIO_RENDER_SIZES="${FOLIO_RENDER_SIZES:-}" TEST_RUNNER_FOLIO_RENDER_SCREENS="${FOLIO_RENDER_SCREENS:-}" \
TEST_RUNNER_FOLIO_RENDER_SCENARIOS="${FOLIO_RENDER_SCENARIOS:-}" \
xcodebuild -scheme Folio -destination 'platform=macOS,arch=arm64' test -quiet -skipMacroValidation \
  -only-testing:FolioTests/ScreenRenders -testLanguage ko -testRegion KR
echo "$dir"
"""

[tasks.install-mac]
description = "Build a Release app and install it to /Applications"
depends = ["generate"]
# A fixed build folder so the copy step knows where the app lands; a running copy is quit first so it is replaced whole.
run = """
xcodebuild -scheme Folio -configuration Release -destination 'platform=macOS' -derivedDataPath .build/xcode build -quiet -skipMacroValidation
osascript -e 'quit app "Folio"' 2>/dev/null || true
# The app was Coursebook.app before it was renamed; the old copy goes so only one remains.
rm -rf /Applications/Coursebook.app /Applications/Folio.app
ditto .build/xcode/Build/Products/Release/Folio.app /Applications/Folio.app
"""

[tasks.build-ipad]
description = "Build the app for the iPad simulator"
depends = ["generate"]
run = "xcodebuild -scheme Folio -destination 'generic/platform=iOS Simulator' build -quiet -skipMacroValidation"

[tasks.build-web]
description = "Bundle the note reader math and the live-preview editor into app/resources/web"
dir = "web"
run = ["npm ci --ignore-scripts --no-audit --no-fund", "npm run build"]
