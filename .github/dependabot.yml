version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule: { interval: weekly }
    groups:
      swift: { patterns: ["*"] }

  # 이 판 올리기는 sources/app/resources/web을 다시 묶지 않으므로, 머지하기 전에 그 PR에서 mise run build-web을 실행한다.
  - package-ecosystem: npm
    directory: /sources/web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
