version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule: { interval: weekly }
    groups:
      swift: { patterns: ["*"] }

  # A bump here does not rebuild sources/app/resources/web; run mise run build-web on the PR before merging.
  - package-ecosystem: npm
    directory: /sources/web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
