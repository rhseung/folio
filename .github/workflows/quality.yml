# Unused code (Periphery) and unused imports and declarations (SwiftLint's analyzer). Both need a whole Mac build,
# which CI's test job doesn't make, so they run weekly and on a PR that changes their settings. They report in the
# run's summary and fail nothing: what they find is a list to work through, and some of it (code reached only by
# name) needs a person to judge.
name: quality

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - .periphery.yml
      - .swiftlint.yml
      - .github/workflows/quality.yml

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: xcode-27
    env:
      # mise.toml sets DEVELOPER_DIR to /Applications/Xcode.app; the image keeps each Xcode under its version.
      XCODE: /Applications/Xcode_27.1.app
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo ln -sfn "$XCODE" /Applications/Xcode.app
      - uses: actions/cache@v6
        with:
          path: sources/tectonic/vendor
          key: tectonic-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources/tectonic/pin.json') }}
      - uses: jdx/mise-action@v5
      - name: Periphery
        continue-on-error: true
        run: |
          mise run periphery 2>&1 | tee .build-periphery.txt
          { echo "## Periphery: code nothing uses"; echo '```'; grep -E 'warning:' .build-periphery.txt | sed "s|$PWD/||" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: SwiftLint analyzer
        continue-on-error: true
        run: |
          mise run analyze 2>&1 | tee .build-analyze.txt
          { echo "## SwiftLint analyzer: unused imports and declarations"; echo '```'; grep -E '(warning|error):' .build-analyze.txt | sed "s|$PWD/||" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
