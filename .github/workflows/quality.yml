# Periphery와 SwiftLint analyzer는 CI의 test 작업이 만들지 않는 Mac 앱 전체 빌드가 필요하므로, 매주 한 번과 설정을 바꾼
# PR에서만 돌린다. 찾은 것에는 이름으로만 닿는 코드도 섞여 있어 사람이 판단해야 하므로, 실패로 치지 않고 실행 요약에 적는다.
name: quality

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - .periphery.yml
      - .swiftlint.yml
      - .github/workflows/quality.yml

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: xcode-27
    env:
      # mise.toml이 DEVELOPER_DIR을 /Applications/Xcode.app으로 정하는데, 러너 이미지는 Xcode를 버전별 이름으로 둔다.
      XCODE: /Applications/Xcode_27.1.app
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo ln -sfn "$XCODE" /Applications/Xcode.app
      - uses: actions/cache@v6
        with:
          path: sources/tectonic/vendor
          key: tectonic-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources/tectonic/pin.json') }}
      - uses: jdx/mise-action@v5
      - name: Periphery
        continue-on-error: true
        run: |
          mise run periphery 2>&1 | tee .build-periphery.txt
          { echo "## Periphery: code nothing uses"; echo '```'; grep -E 'warning:' .build-periphery.txt | sed "s|$PWD/||" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: SwiftLint analyzer
        continue-on-error: true
        run: |
          mise run analyze 2>&1 | tee .build-analyze.txt
          { echo "## SwiftLint analyzer: unused imports and declarations"; echo '```'; grep -E '(warning|error):' .build-analyze.txt | sed "s|$PWD/||" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
