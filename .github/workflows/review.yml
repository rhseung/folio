name: review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.files.outputs.docs }}
    steps:
      - id: files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # GitHub은 파일을 300개 넘게 바꾼 PR의 diff를 거절하므로 `gh pr diff --name-only`를 쓰지 않는다.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          # 다른 .md 파일은 테스트 픽스처(tests/unit/app/fixtures/all-markdown.md)나 생성한 스킬 사본처럼 입력이므로 리뷰를 받는다.
          if [ -n "$files" ] && ! grep -qvE '^docs/|^[^/]+\.md$|^\.github/.+\.md$' <<< "$files"; then
            echo docs=true >> "$GITHUB_OUTPUT"
          else
            echo docs=false >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: changes
    if: vars.ENABLE_CLAUDE_REVIEW == 'true' && needs.changes.outputs.docs != 'true'
    uses: rhseung/claude-review-plugin/.github/workflows/review.yml@main
    # Dependabot 실행은 Dependabot secret만 받으므로, CLAUDE_CODE_OAUTH_TOKEN을 그쪽에도 넣어야 한다
    # (gh secret set --app dependabot).
    with:
      allowed_bots: dependabot[bot]
    secrets: inherit

  approve-docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr review "$PR" -R "$GITHUB_REPOSITORY" --approve -b "Docs-only change, approved without code review."
