name: review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  pick:
    name: pick checks
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.files.outcome == 'success' && steps.files.outputs.all_count != '0' && steps.files.outputs.code == 'false' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/check-paths.yml
          sparse-checkout-cone-mode: false
      # 어떤 파일이 문서인지는 .github/check-paths.yml의 code 필터가 정한다. GitHub은 파일을 300개 넘게 바꾼 PR의 diff를
      # 거절하지만 paths-filter는 파일 목록 API를 쓰므로 그런 PR도 센다.
      - if: github.event_name == 'pull_request'
        id: files
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/check-paths.yml
          predicate-quantifier: some-with-excludes

  review:
    needs: pick
    if: vars.ENABLE_CLAUDE_REVIEW == 'true' && needs.pick.outputs.docs != 'true'
    uses: rhseung/claude-review-plugin/.github/workflows/review.yml@main
    # Dependabot 실행은 Dependabot secret만 받으므로, CLAUDE_CODE_OAUTH_TOKEN을 그쪽에도 넣어야 한다
    # (gh secret set --app dependabot).
    with:
      allowed_bots: dependabot[bot]
    secrets: inherit

  approve-docs:
    needs: pick
    if: needs.pick.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr review "$PR" -R "$GITHUB_REPOSITORY" --approve -b "Docs-only change, approved without code review."
