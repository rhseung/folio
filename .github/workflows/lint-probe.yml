name: lint-probe
on:
  push:
    branches: [rhseung/ci-cleanup]
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
jobs:
  probe:
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v7
      - run: swift --version; swift format --version; uname -m; ls /usr/lib/libsourcekitdInProc.so || find / -name 'libsourcekitdInProc.so' 2>/dev/null | head
      - name: build folio-lint without vendor
        run: time swift build -q -c release --product folio-lint 2>&1 | tail -30
      - name: run folio-lint
        run: swift run -q -c release --skip-build folio-lint 2>&1 | tail -30
      - name: swift-format lint
        run: scripts/swift-format.sh lint 2>&1 | tail -30
      - uses: jdx/mise-action@v5
        with:
          install_args: swiftlint
        continue-on-error: true
      - name: swiftlint
        run: mise exec -- swiftlint version && mise exec -- swiftlint lint --quiet --strict --baseline .swiftlint-baseline.json 2>&1 | tail -30
