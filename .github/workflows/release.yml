name: Release

# A pushed v* tag (mise run release-tag) builds the Release app and drafts its GitHub release; publishing the draft is
# done by hand. A manual run is a dry run: the same build and notes, uploaded as an artifact, with no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      since:
        description: Notes from the PRs merged after this ref (default the latest v* tag)
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  XCODE: /Applications/Xcode_27.1.app
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      # The whole history: the build number is the commit count, and the notes start at the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: sudo ln -sfn "$XCODE" /Applications/Xcode.app
      - uses: jdx/mise-action@v5
      - id: version
        run: |
          v=$(scripts/version.sh get)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but FolioVersion is $v; tag with mise run release-tag."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Folio $v ($(scripts/version.sh build))"
      - run: mise run build-release
      # TODO(#414): with a Developer ID (after the Apple Developer signup), sign with the hardened runtime here, then
      # notarize (xcrun notarytool submit --wait) and staple, with the certificate and the notary key in secrets.
      # TODO(#414): sign the zip for Sparkle (sign_update with the EdDSA key from a secret) and update the appcast.
      - name: Zip
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .build/release
          ditto -c -k --sequesterRsrc --keepParent .build/DerivedData/Build/Products/Release/Folio.app ".build/release/Folio-$VERSION.zip"
      # The patch notes are the merged PRs' `## 패치 노트` sections, read from their bodies now; the app reads them back
      # from this release's body (#415). A body fixed after the draft is made needs a rerun of the tag's workflow.
      - name: Notes
        env:
          SINCE: ${{ inputs.since }}
        run: |
          if [ -z "$SINCE" ]; then
            # From the tag's parent, so a tag never finds itself.
            SINCE=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          fi
          scripts/release-notes.sh body "$SINCE" > .build/release/body.md
          cat .build/release/body.md >> "$GITHUB_STEP_SUMMARY"
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: .build/release
      # A rerun of the same tag replaces the draft's files and notes instead of failing on the existing release.
      - if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip=".build/release/Folio-$VERSION.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file .build/release/body.md
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --draft --verify-tag --title "Folio $VERSION" --notes-file .build/release/body.md
          fi
