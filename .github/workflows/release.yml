name: Release

# 버전의 원본은 태그다. main에 머지된 PR들에 패치 노트가 있으면 이 워크플로가 다음 버전의 태그를 달고 같은 실행에서
# 빌드해 게시한다(GITHUB_TOKEN으로 푸시한 태그는 워크플로를 다시 부르지 않는다). 사람이 푸시한 태그(`mise run
# release-tag`)도 같은 길로 게시한다.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 태그는 지난 태그 다음 번호이므로 실행이 겹치면 안 된다. 기다리던 실행이 새 실행에 밀려 취소되어도, 다음 실행이 지난
# 태그 뒤의 PR을 모두 담는다.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  XCODE: /Applications/Xcode_27.1.app
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_TASK_RUN_AUTO_INSTALL: false
  GH_TOKEN: ${{ github.token }}
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      # 빌드 번호가 커밋 수이고 패치 노트가 이전 태그부터 시작하므로, 전체 기록과 태그를 받는다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/xcode-setup
        with:
          tools: xcodegen
      # folio-dev는 packages 작업이 main push마다 남긴 패키지 빌드 캐시에서 시작한다.
      - uses: actions/cache/restore@v6
        with:
          path: |
            .build
            !.build/tectonic
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode }}-${{ hashFiles('sources/tectonic/pin.json') }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode }}-${{ hashFiles('sources/tectonic/pin.json') }}-${{ hashFiles('Package.resolved') }}-
      - id: version
        run: |
          mise run tectonic
          swift build -q --product folio-dev
          dev() { swift run -q --skip-build folio-dev "$@"; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v=${GITHUB_REF_NAME#v}
            # `release past`로 노트만 게시한 지난 버전은 다시 빌드하지 않는다.
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
              echo "$GITHUB_REF_NAME is already published"
              exit 0
            fi
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            v=$(dev release next --at "$GITHUB_SHA")
            if [ -z "$v" ]; then
              echo "No PR since $(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo 'the start') has patch notes"
              exit 0
            fi
            dev release tag "$v" --at "$GITHUB_SHA"
          else
            v=$(dev version get)
          fi
          dev version stamp "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Folio $v ($(git rev-list --count HEAD))"
      - if: steps.version.outputs.version != ''
        run: mise run build-release
      # TODO(#414): with a Developer ID (after the Apple Developer signup), sign with the hardened runtime here, then
      # notarize (xcrun notarytool submit --wait) and staple, with the certificate and the notary key in secrets.
      # TODO(#414): sign the zip for Sparkle (sign_update with the EdDSA key from a secret) and update the appcast.
      - if: steps.version.outputs.version != ''
        name: Zip and notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .build/release
          ditto -c -k --sequesterRsrc --keepParent .build/DerivedData/Build/Products/Release/Folio.app ".build/release/Folio-$VERSION.zip"
          swift run -q --skip-build folio-dev release-notes body "$VERSION" HEAD > .build/release/body.md
          cat .build/release/body.md >> "$GITHUB_STEP_SUMMARY"
      - if: steps.version.outputs.version != '' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: .build/release
      # 같은 태그로 다시 실행하면 이미 있는 릴리스에서 실패하지 않도록, 그 릴리스의 파일과 본문을 바꾸고 게시한다.
      - if: steps.version.outputs.version != '' && github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          zip=".build/release/Folio-$VERSION.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
            gh release edit "$tag" --notes-file .build/release/body.md --draft=false
          else
            gh release create "$tag" "$zip" --verify-tag --title "Folio $VERSION" --notes-file .build/release/body.md
          fi
