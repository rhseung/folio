name: Release

# 버전의 원본은 태그다. `plan`이 게시할 버전을 정하고(패치 노트가 있는 PR마다 하나), `release`가 버전마다 그 PR의 머지
# 커밋을 빌드한 뒤 태그를 달고 게시한다. 태그를 게시 바로 앞에서 달아야 빌드가 실패한 실행을 다시 돌려도 같은 버전을 다시
# 만든다. 사람이 푸시한 태그(`mise run release-tag`)도 같은 길로 게시하고, 그 실행이 대기 중에 취소되면 다음 실행의 `plan`이
# 게시되지 않은 태그로 찾는다. 대기 중에 취소된 main push의 PR도 지난 태그 뒤에 남아 있으므로 다음 실행이 따로 낸다.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 다음 버전은 지난 태그 다음 번호이므로 실행이 겹치면 안 된다.
concurrency:
  group: release
  cancel-in-progress: false

# 묶음 minor를 정하려고 PR이 닫은 이슈와 묶음 라벨의 이슈를 읽는다.
permissions:
  contents: write
  issues: read
  pull-requests: read

env:
  XCODE: /Applications/Xcode_27.1.app
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_TASK_RUN_AUTO_INSTALL: false
  GH_TOKEN: ${{ github.token }}
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  plan:
    runs-on: xcode-27
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      # 패치 노트가 이전 태그부터 시작하므로 전체 기록과 태그를 받는다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/xcode-setup
        with:
          tools: xcodegen
      # folio-dev는 packages 작업이 main push마다 남긴 패키지 빌드 캐시에서 시작한다.
      - uses: actions/cache/restore@v6
        with:
          path: |
            .build
            !.build/tectonic
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode }}-${{ hashFiles('sources/tectonic/pin.json') }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode }}-${{ hashFiles('sources/tectonic/pin.json') }}-${{ hashFiles('Package.resolved') }}-
      - id: plan
        run: |
          mise run tectonic
          swift build -q --product folio-dev
          matrix=$(swift run -q --skip-build folio-dev release plan --at "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: xcode-27
    timeout-minutes: 60
    # 버전은 낮은 것부터 하나씩 낸다. 앞 버전이 실패하면 뒤 버전을 멈춰, 다음 실행이 같은 PR부터 같은 번호로 다시 낸다.
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VERSION: ${{ matrix.version }}
      REF: ${{ matrix.ref }}
      BUNDLES: ${{ toJSON(matrix.bundles) }}
    steps:
      # 빌드 번호가 커밋 수이므로 전체 기록을 받는다. folio-dev는 이 실행의 커밋(main)에서 빌드하고, 앱은 그 버전의 커밋에서
      # 빌드한다. 지난 PR의 커밋에는 묶음 같은 새 옵션이 없기 때문이다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/xcode-setup
        with:
          tools: xcodegen
      - uses: actions/cache/restore@v6
        with:
          path: |
            .build
            !.build/tectonic
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode }}-${{ hashFiles('sources/tectonic/pin.json') }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode }}-${{ hashFiles('sources/tectonic/pin.json') }}-${{ hashFiles('Package.resolved') }}-
      - run: |
          mise run tectonic
          swift build -q --product folio-dev
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$(swift build --show-bin-path)/folio-dev" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: |
          git checkout -q --force --detach "$REF"
          mise run tectonic
          folio-dev version stamp "$VERSION"
          echo "Folio $VERSION ($(git rev-list --count HEAD))"
      - run: mise run build-release
      # 앱이 자기 버전을 0.0.0으로 알면 새 기능 화면과 업데이트 확인이 깨지므로, 써넣은 버전이 앱에 들어갔는지 본다.
      - run: |
          app=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' .build/DerivedData/Build/Products/Release/Folio.app/Contents/Info.plist)
          [ "$app" = "$VERSION" ] || { echo "::error::the app reports $app, not $VERSION"; exit 1; }
      # TODO(#414): with a Developer ID (after the Apple Developer signup), sign with the hardened runtime here, then
      # notarize (xcrun notarytool submit --wait) and staple, with the certificate and the notary key in secrets.
      # TODO(#414): sign the zip for Sparkle (sign_update with the EdDSA key from a secret) and update the appcast.
      - name: Zip and notes
        run: |
          mkdir -p .build/release
          ditto -c -k --sequesterRsrc --keepParent .build/DerivedData/Build/Products/Release/Folio.app ".build/release/Folio-$VERSION.zip"
          folio-dev release-notes body "$VERSION" HEAD > .build/release/body.md
          cat .build/release/body.md >> "$GITHUB_STEP_SUMMARY"
      # 같은 버전을 다시 돌리면 이미 있는 태그와 릴리스를 그대로 쓰고, 릴리스의 파일과 본문을 바꿔 게시한다.
      - name: Tag and publish
        run: |
          tag="v$VERSION"
          zip=".build/release/Folio-$VERSION.zip"
          folio-dev release tag "$VERSION" --at HEAD --bundles "$BUNDLES"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
            gh release edit "$tag" --title "Folio $VERSION" --notes-file .build/release/body.md --draft=false
          else
            gh release create "$tag" "$zip" --verify-tag --title "Folio $VERSION" --notes-file .build/release/body.md
          fi
