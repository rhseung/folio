name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise.toml이 DEVELOPER_DIR을 /Applications/Xcode.app으로 정하는데, 러너 이미지는 Xcode를 버전별 이름으로 둔다.
  XCODE: /Applications/Xcode_27.1.app
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  MISE_TASK_RUN_AUTO_INSTALL: false

# macOS 러너는 동시 실행 수가 정해져 있어(#385) PR이 여럿이면 줄을 선다. 그래서 PR의 macOS 작업은 셋이고, PR의 파일이
# 닿지 않는 작업은 건너뛴다. 건너뛴 작업은 ruleset에 성공으로 보고되므로 필수 검사도 이름 그대로 보고된다. lint는 커밋
# 전 훅(lefthook.yml)이 먼저 하므로 따로 작업을 두지 않고 packages가 맨 앞에서 한 번 더 한다.
jobs:
  pick:
    name: pick checks
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
      mac-app: ${{ steps.pick.outputs.mac-app }}
      ipad-app: ${{ steps.pick.outputs.ipad-app }}
      ipad-simulator: ${{ steps.pick.outputs.ipad-simulator }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/check-paths.yml
          sparse-checkout-cone-mode: false
      # 이름을 바꾼 파일은 옛 경로도 센다(paths-filter가 지운 파일과 더한 파일로 나눈다). sources/app 밖으로 옮긴 파일도
      # 빌드하는 대상을 바꾸기 때문이다.
      - if: github.event_name == 'pull_request'
        id: files
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/check-paths.yml
          predicate-quantifier: some-with-excludes
      # main push는 모든 검사를 돌린다. main CI 실패를 P0로 보는 근거다. 필터가 실패해도 모두 돌리고, API는 파일을
      # 3000개까지만 돌려주므로 그보다 긴 목록에는 검사에 닿는 파일이 빠졌을 수 있어 모두 돌린다.
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          OUTCOME: ${{ steps.files.outcome }}
          COUNT: ${{ steps.files.outputs.all_count }}
          PACKAGES: ${{ steps.files.outputs.packages }}
          MAC_APP: ${{ steps.files.outputs.mac-app }}
          IPAD_APP: ${{ steps.files.outputs.ipad-app }}
          IPAD_SIMULATOR: ${{ steps.files.outputs.ipad-simulator }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$OUTCOME" != success ] || [ "${COUNT:-0}" -ge 3000 ]; then
            PACKAGES=true MAC_APP=true IPAD_APP=true IPAD_SIMULATOR=true
          fi
          {
            echo "packages=$PACKAGES"
            echo "mac-app=$MAC_APP"
            echo "ipad-app=$IPAD_APP"
            echo "ipad-simulator=$IPAD_SIMULATOR"
          } | tee -a "$GITHUB_OUTPUT"

  packages:
    needs: pick
    # `pick`이 실패해 출력이 비면 이 작업을 실행한다.
    if: ${{ !cancelled() && needs.pick.outputs.packages != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/xcode-setup
        with:
          tools: swiftlint shellcheck shfmt
      # 미리 컴파일한 FolioTectonic 모듈(.pcm)은 바이너리 타깃이 .build에 복사한 헤더의 경로를 기억하고, SwiftPM은 라이브러리가
      # 바뀌어도 그 모듈을 다시 만들지 않는다. 그래서 핀이 다른 캐시를 복원하면 없는 헤더를 찾다가 컴파일이 실패하므로 키에 핀을 넣는다.
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build
            !.build/tectonic
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode }}-${{ hashFiles('sources/tectonic/pin.json') }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode }}-${{ hashFiles('sources/tectonic/pin.json') }}-${{ hashFiles('Package.resolved') }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode }}-${{ hashFiles('sources/tectonic/pin.json') }}-
      - id: run
        run: mise run test
      - if: ${{ !cancelled() && (github.event_name == 'push' || steps.cache.outputs.cache-matched-key == '') && steps.run.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .build
            !.build/tectonic
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # 노트 보기 검사와 나머지를 한 작업에서 돌린다. 둘로 나누면 같은 Debug 앱을 두 러너가 따로 빌드한다.
  mac-app:
    name: mac app
    needs: pick
    if: ${{ !cancelled() && needs.pick.outputs.mac-app != 'false' }}
    runs-on: xcode-27
    # main 스레드에서 멈춘 테스트는 자기 시간 제한을 넘겨도 끝나지 않는다. 이 값이 없으면 작업이 여섯 시간 동안 돈다.
    timeout-minutes: 45
    env:
      # 노트 보기 기준 이미지는 이 러너가 그린 것이다. 러너 이미지가 바뀌면 비교를 조용히 건너뛰지 않고 실패하게 한다.
      FOLIO_NOTE_SCREENS_STRICT: 1
      FOLIO_NOTE_SCREENS: ${{ github.workspace }}/.build/note-screens
    steps:
      - uses: actions/checkout@v7
      # accessibility.yml도 같은 Debug Mac 앱을 빌드하므로 이 캐시에서 시작한다.
      - id: setup
        uses: ./.github/actions/xcode-setup
        with:
          derived-data: test-app
          tools: xcodegen
      - id: run
        run: mise run test-app
      - if: ${{ !cancelled() && steps.run.outcome != 'skipped' }}
        uses: ./.github/actions/xcode-cache-save
        with:
          primary-key: ${{ steps.setup.outputs.cache-primary-key }}
          matched-key: ${{ steps.setup.outputs.cache-matched-key }}
          outcome: ${{ steps.run.outcome }}
      - if: ${{ !cancelled() && steps.run.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: note-sheets
          path: .build/note-screens/sheets
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: note-screens
          path: |
            .build/note-screens
            !.build/note-screens/sheets
          if-no-files-found: ignore

  # macOS 전용 API를 쓴 코드가 main을 세 번 깨뜨렸으므로 PR마다 iOS로 컴파일한다. 시뮬레이터 테스트는 그 테스트가 읽는
  # 코드가 바뀐 PR과 main push에서만 돌린다.
  ipad-app:
    name: ipad app
    needs: pick
    if: ${{ !cancelled() && needs.pick.outputs.ipad-app != 'false' }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      SIMULATOR: ${{ needs.pick.outputs.ipad-simulator != 'false' }}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/xcode-setup
        with:
          derived-data: test-ipad
          tools: xcodegen
      # 시뮬레이터 부팅은 몇 분 걸리므로 빌드하는 동안 백그라운드에서 켠다.
      - if: env.SIMULATOR == 'true'
        name: Boot the iPad simulator while the app builds
        env:
          DEVELOPER_DIR: ${{ env.XCODE }}/Contents/Developer
        run: nohup scripts/ipad-simulator.sh boot > "$RUNNER_TEMP/boot.log" 2>&1 &
      - id: run
        run: mise run build-ipad-tests
      - if: env.SIMULATOR == 'true'
        id: test
        run: mise run test-ipad
      - if: ${{ !cancelled() && steps.run.outcome != 'skipped' }}
        uses: ./.github/actions/xcode-cache-save
        with:
          primary-key: ${{ steps.setup.outputs.cache-primary-key }}
          matched-key: ${{ steps.setup.outputs.cache-matched-key }}
          outcome: ${{ steps.run.outcome }}

  # 다른 검사는 모두 Debug로 빌드하므로 iPad 빌드는 Release로 해서, #if DEBUG 안에만 있는 코드를 쓰는 곳도 잡는다. PR에서는
  # ipad app이 iOS 컴파일을 맡으므로 main에서만 돌린다.
  ipad-release:
    name: ipad release
    if: github.event_name == 'push'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      FOLIO_CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/xcode-setup
        with:
          derived-data: build-ipad
          tools: xcodegen
      - id: run
        run: mise run build-ipad
      - if: ${{ !cancelled() && steps.run.outcome != 'skipped' }}
        uses: ./.github/actions/xcode-cache-save
        with:
          primary-key: ${{ steps.setup.outputs.cache-primary-key }}
          matched-key: ${{ steps.setup.outputs.cache-matched-key }}
          outcome: ${{ steps.run.outcome }}
