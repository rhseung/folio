name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise.toml이 DEVELOPER_DIR을 /Applications/Xcode.app으로 정하는데, 러너 이미지는 Xcode를 버전별 이름으로 둔다.
  XCODE: /Applications/Xcode_27.1.app
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.files.outputs.test }}
      test-app: ${{ steps.files.outputs.test-app }}
      test-app-notes: ${{ steps.files.outputs.test-app }}
      test-app-rest: ${{ steps.files.outputs.test-app }}
      build-ipad: ${{ steps.files.outputs.build-ipad }}
      test-ipad: ${{ steps.files.outputs.test-ipad }}
      test-a11y: ${{ steps.files.outputs.test-a11y }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          tasks="test test-app build-ipad test-ipad test-a11y"
          run_all() { for t in $tasks; do echo "$t=true" >> "$GITHUB_OUTPUT"; done; exit 0; }
          [ "$EVENT" = pull_request ] || run_all
          # 이름을 바꾼 파일은 옛 경로도 센다. sources/app 밖으로 옮긴 파일도 빌드하는 대상을 바꾸기 때문이다.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)') || run_all
          # API는 파일을 3000개까지만 돌려주므로, 그보다 긴 목록에는 검사에 닿는 파일이 빠졌을 수 있다.
          [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 3000 ] || run_all
          printf '%s\n' "$files"
          none='^docs/|^[^/]+\.md$|^\.github/.+\.md$|^sources/web/|^sources/tectonic/(bridge|patches)/|^sources/tectonic/build\.sh$|^\.github/workflows/tectonic\.yml$'
          # 여기 없는 스크립트는 모두 검사에 닿는다고 본다. 예를 들어 `mise run generate`는 빌드마다 scripts/version.sh를 실행한다.
          checks='^scripts/(note-screens|release-notes|install-release|swift-format)\.sh$|^sources/lint(-command)?/|^tests/unit/lint/|^\.folio-lint-baseline\.txt$|^\.swiftlint(\.yml|-baseline\.json)$|^\.swift-format$|^\.periphery\.yml$|^lefthook\.yml$|^\.github/workflows/quality\.yml$'
          build_ipad="$none|^tests/unit/app/|^tests/e2e/app/|$checks|^\.claude/|^sources/app/resources/web/"
          test_app="$none|^tests/e2e/app/|$checks|^\.claude/"
          test_ipad="$none|^tests/e2e/app/|$checks|^\.claude/|^tests/unit/app/[^/]+$|^tests/unit/app/(support|note-view|window|screens|models|references|fixtures)/"
          test_a11y="$none|^tests/unit/app/|$checks|^\.claude/"
          needs() { if grep -qvE "$1" <<< "$files"; then echo true; else echo false; fi; }
          # test는 sources/app, tests/unit/app, tests/e2e/app에서 Swift 파일만 읽는다(folio-lint, SwiftLint, 액션 검사).
          # 이 조건은 lookahead 없이 패턴 하나로 쓸 수 없으므로 needs를 쓰지 않고 따로 검사한다.
          if [ -n "$(grep -vE "$none|^(sources/app|tests/unit/app|tests/e2e/app)/" <<< "$files" || true)" ] || grep -qE '^(sources/app|tests/unit/app|tests/e2e/app)/.*\.swift$' <<< "$files"
          then test=true; else test=false; fi
          {
            echo "test=$test"
            echo "test-app=$(needs "$test_app")"
            echo "build-ipad=$(needs "$build_ipad")"
            echo "test-ipad=$(needs "$test_ipad")"
            echo "test-a11y=$(needs "$test_a11y")"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    # 건너뛴 작업은 ruleset에 성공으로 보고된다. `changes`가 실패해 출력이 비면 이 작업을 실행한다.
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      # checkout은 모든 파일에 지금 시각을 찍는다. Xcode와 SwiftPM은 소스의 시각을 지난 빌드가 기록한 시각과 비교하므로,
      # 이대로면 캐시에 든 것을 모두 다시 컴파일한다. 파일 내용(blob 해시)에서 만든 시각은 내용이 같으면 어느 러너에서나
      # 같고 내용이 바뀌면 달라지므로, 캐시된 빌드가 바뀌지 않은 파일만 건너뛴다. 시각은 2001-2010년 사이라 미래가 되지 않는다.
      - name: Pin file times to content
        run: |
          git ls-files -s -z | perl -0ne 'my ($mode, $sha, $path) = /^(\d+) ([0-9a-f]+) \d+\t(.*)\0$/s or next; next unless $mode =~ /^100/; my $t = 1_000_000_000 + hex(substr($sha, 0, 7)); utime($t, $t, $path) or die "$path: $!"'
      - run: sudo ln -sfn "$XCODE" /Applications/Xcode.app
      # Apple의 날짜 인식기는 한국어가 선호 언어일 때만 `오후 3시`나 `자정`을 읽는다. 영어 러너에서는 날짜만 읽고 시각을 버린다.
      - run: defaults write -g AppleLanguages -array ko-KR en-US && defaults write -g AppleLocale ko_KR
      - id: xcode
        run: echo "version=$(DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # 미리 컴파일한 FolioTectonic 모듈(.pcm)은 바이너리 타깃이 .build에 복사한 헤더의 경로를 기억하고, SwiftPM은 라이브러리가
      # 바뀌어도 그 모듈을 다시 만들지 않는다. 그래서 핀이 다른 캐시를 복원하면 없는 헤더를 찾다가 컴파일이 실패하므로 키에 핀을 넣는다.
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build
            !.build/tectonic
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('sources/tectonic/pin.json') }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('sources/tectonic/pin.json') }}-${{ hashFiles('Package.resolved') }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('sources/tectonic/pin.json') }}-
      - uses: actions/cache@v6
        with:
          path: sources/tectonic/vendor
          key: tectonic-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources/tectonic/pin.json') }}
      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Tectonic
          key: tectonic-tex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources/tectonic/pin.json') }}
          restore-keys: tectonic-tex-${{ runner.os }}-${{ runner.arch }}-
      - uses: jdx/mise-action@v5
      - id: run
        run: mise run test
      - if: ${{ !cancelled() && (github.event_name == 'push' || steps.cache.outputs.cache-matched-key == '') && steps.run.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .build
            !.build/tectonic
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build:
    needs: changes
    if: ${{ !cancelled() }}
    # 필수 검사는 PR의 파일이 닿지 않아도 matrix 이름으로 보고해야 한다. 작업 단위의 `if`로 건너뛰면 matrix가 펼쳐지지 않아
    # 그 이름으로 보고하지 못하므로, 대신 Linux 러너에서 모든 단계를 건너뛰며 실행한다.
    runs-on: ${{ needs.changes.outputs[matrix.task] == 'false' && 'ubuntu-latest' || 'xcode-27' }}
    # main 스레드에서 멈춘 테스트는 자기 시간 제한을 넘겨도 끝나지 않는다. 이 값이 없으면 작업이 여섯 시간 동안 돈다.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        task: [test-app-notes, test-app-rest, build-ipad, test-ipad, test-a11y]
    env:
      RUN: ${{ needs.changes.outputs[matrix.task] != 'false' }}
      MISE_TASK: ${{ startsWith(matrix.task, 'test-app-') && 'test-app' || matrix.task }}
      # 접근성 검사는 test-app과 같은 Debug Mac 앱을 빌드하므로 그 캐시에서 시작한다. 캐시를 저장하지 않는 것은
      # 저장하면 UI 테스트 러너가 캐시 용량만 차지하기 때문이다.
      CACHE_TASK: ${{ (startsWith(matrix.task, 'test-app-') || matrix.task == 'test-a11y') && 'test-app' || matrix.task }}
      FOLIO_TEST_PART: ${{ matrix.task == 'test-app-notes' && 'notes' || matrix.task == 'test-app-rest' && 'rest' || '' }}
      # 다른 검사는 모두 Debug로 빌드하므로 iPad 빌드는 Release로 해서, #if DEBUG 안에만 있는 코드를 쓰는 곳도 잡는다.
      # 머지한 뒤에만 돌렸을 때 macOS 전용 API가 main을 세 번 깨뜨렸으므로 PR에서도 돌린다.
      FOLIO_CONFIGURATION: ${{ matrix.task == 'build-ipad' && 'Release' || 'Debug' }}
      # 노트 보기 기준 이미지는 이 러너가 그린 것이다. 러너 이미지가 바뀌면 비교를 조용히 건너뛰지 않고 실패하게 한다.
      FOLIO_NOTE_SCREENS_STRICT: 1
      FOLIO_NOTE_SCREENS: ${{ github.workspace }}/.build/note-screens
    steps:
      - if: env.RUN != 'true'
        run: echo "No file in this PR reaches ${{ matrix.task }}."
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      - if: env.RUN == 'true'
        name: Pin file times to content
        run: |
          git ls-files -s -z | perl -0ne 'my ($mode, $sha, $path) = /^(\d+) ([0-9a-f]+) \d+\t(.*)\0$/s or next; next unless $mode =~ /^100/; my $t = 1_000_000_000 + hex(substr($sha, 0, 7)); utime($t, $t, $path) or die "$path: $!"'
      - if: env.RUN == 'true'
        run: sudo ln -sfn "$XCODE" /Applications/Xcode.app
      - if: env.RUN == 'true'
        run: defaults write -g AppleLanguages -array ko-KR en-US && defaults write -g AppleLocale ko_KR
      - if: env.RUN == 'true'
        id: xcode
        run: echo "version=$(DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      - if: env.RUN == 'true'
        id: key
        run: |
          echo "base=derived-data-$CACHE_TASK-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "deps=${{ hashFiles('Package.resolved', 'project.yml') }}" >> "$GITHUB_OUTPUT"
      # 작업마다 다른 플랫폼이나 구성을 자기 DerivedData에 빌드하므로 캐시를 작업마다 둔다. PR은 맞는 캐시가 없을 때만
      # 저장한다. 그래야 PR의 push가 저장한 캐시 때문에 main의 캐시가 10 GB 한도를 넘어 지워지지 않는다.
      - if: env.RUN == 'true'
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/DerivedData
            !.build/DerivedData/Index.noindex
            !.build/DerivedData/Logs
            !.build/DerivedData/TestResults
            Folio.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: ${{ steps.key.outputs.base }}-${{ steps.key.outputs.deps }}-${{ github.sha }}
          restore-keys: |
            ${{ steps.key.outputs.base }}-${{ steps.key.outputs.deps }}-
            ${{ steps.key.outputs.base }}-
      # Folio.xcodeproj를 커밋하지 않으므로 그 Package.resolved는 캐시에만 있다. 이 파일이 있으면 xcodebuild가 패키지 해석
      # 1분을 건너뛰지만(-skipPackageUpdates), 파일에 고정된 판도 그대로 쓴다. 그래서 커밋한 Package.resolved와 project.yml이
      # 같은 캐시의 파일만 쓴다. 다른 캐시의 파일을 쓰면 올린 의존성을 옛 판으로 빌드한다.
      - if: env.RUN == 'true'
        name: Reuse package versions only from the same dependencies
        env:
          SAME: ${{ github.event_name != 'push' && startsWith(steps.cache.outputs.cache-matched-key, format('{0}-{1}-', steps.key.outputs.base, steps.key.outputs.deps)) }}
        run: |
          if [ "$SAME" = true ]; then
            echo "FOLIO_XCODEBUILD_FLAGS=-skipPackageUpdates" >> "$GITHUB_ENV"
          else
            rm -f Folio.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          fi
      # Xcode는 리소스를 번들에 복사할 때 옛 파일을 지우지 않으므로, 브랜치가 지운 파일이 남지 않게 앱, 테스트, 리소스 번들을
      # 지운다. 또 Xcode는 inode가 바뀐 소스를 고친 파일로 보는데 이 머신에서는 모든 파일이 새것이므로, 시각과 크기만 보게 한다.
      - if: env.RUN == 'true'
        run: |
          rm -rf .build/DerivedData/Build/Products/*/*.app .build/DerivedData/Build/Products/*/*.xctest .build/DerivedData/Build/Products/*/*.bundle
          defaults write com.apple.dt.SWBBuildService IgnoreFileSystemDeviceInodeChanges -bool YES
      - if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          path: sources/tectonic/vendor
          key: tectonic-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources/tectonic/pin.json') }}
      - if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Tectonic
          key: tectonic-tex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sources/tectonic/pin.json') }}
          restore-keys: tectonic-tex-${{ runner.os }}-${{ runner.arch }}-
      - if: env.RUN == 'true'
        uses: jdx/mise-action@v5
      - if: env.RUN == 'true'
        id: run
        run: mise run ${{ env.MISE_TASK }}
      # 빌드에 실패한 실행은 의존성이 빠진 캐시를 남기므로 저장하지 않는다. 테스트만 실패했으면 앱은 빌드됐으므로 저장한다.
      - if: ${{ !cancelled() && env.RUN == 'true' && matrix.task != 'test-a11y' && (github.event_name == 'push' || steps.cache.outputs.cache-matched-key == '') && (steps.run.outcome == 'success' || (steps.run.outcome == 'failure' && hashFiles('.build/DerivedData/Build/Products/*/Folio.app/**/Info.plist') != '')) }}
        id: keep
        run: du -sh .build/DerivedData/* || true
      - if: ${{ !cancelled() && steps.keep.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .build/DerivedData
            !.build/DerivedData/Index.noindex
            !.build/DerivedData/Logs
            !.build/DerivedData/TestResults
            Folio.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # 이 그림은 NoteSourceTests가 rest 절반에서 만든다. 같은 이름으로 두 번 올리면 실패하므로 rest에서만 올린다.
      - if: ${{ !cancelled() && env.RUN == 'true' && matrix.task == 'test-app-rest' }}
        uses: actions/upload-artifact@v7
        with:
          name: note-sheets
          path: .build/note-screens/sheets
          if-no-files-found: ignore
      - if: failure() && matrix.task == 'test-app-notes'
        uses: actions/upload-artifact@v7
        with:
          name: note-screens
          path: .build/note-screens
          if-no-files-found: ignore
      - if: failure() && matrix.task == 'test-a11y'
        uses: actions/upload-artifact@v7
        with:
          name: test-a11y
          path: .build/test-a11y.xcresult
          if-no-files-found: ignore

  # ruleset은 build (test-app)을 요구하므로, 이 작업이 위의 두 절반을 기다려 그 이름으로 함께 보고한다. 기다리는 작업이
  # macOS 러너를 모두 차지하면 어느 절반도 시작하지 못하므로, macOS 러너를 쓰지 않고 Linux 러너에서 기다린다.
  test-app:
    name: build (test-app)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - if: needs.changes.outputs.test-app != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          halves='["build (test-app-notes)", "build (test-app-rest)"]'
          while :; do
            states=$(gh api "$jobs" --jq "[.jobs[] | select(.name as \$n | $halves | index(\$n))] | sort_by(.name)[] | \"\(.name): \(.status) \(.conclusion)\"") || states=
            [ "$(grep -c ': completed ' <<< "$states")" = 2 ] && break
            sleep 15
          done
          echo "$states"
          ! grep -v ': completed success$' <<< "$states"
