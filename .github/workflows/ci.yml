name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR makes the older run moot. A cancelled job saves no cache, so none is cut short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # mise.toml sets DEVELOPER_DIR to /Applications/Xcode.app; the image keeps each Xcode under its version.
  XCODE: /Applications/Xcode_27.1.app
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  # Which checks a PR's files can reach. Push to main runs everything. A file a check never reads is listed per check
  # below; any other file, or no answer from the API, runs the check.
  changes:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.files.outputs.test }}
      test-app: ${{ steps.files.outputs.test-app }}
      test-app-notes: ${{ steps.files.outputs.test-app }}
      test-app-rest: ${{ steps.files.outputs.test-app }}
      build-ipad: ${{ steps.files.outputs.build-ipad }}
      test-ipad: ${{ steps.files.outputs.test-ipad }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          tasks="test test-app build-ipad test-ipad"
          run_all() { for t in $tasks; do echo "$t=true" >> "$GITHUB_OUTPUT"; done; exit 0; }
          [ "$EVENT" = pull_request ] || run_all
          # A rename's old path counts too: moving a file out of app/ changes what app/ builds.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)') || run_all
          # The API lists at most 3000 files; a longer list may be missing the one that matters.
          [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 3000 ] || run_all
          printf '%s\n' "$files"
          # Prose, the web bundle's sources (the app ships the built copy in app/resources/web) and PR pictures.
          none='^docs/|^[^/]+\.md$|^\.github/.+\.md$|^web/|^pr-renders/'
          # Scripts these checks never run. Any other script counts: `mise run generate` runs scripts/version.sh before every
          # build, and a script it starts to run later is covered without a change here.
          checks='^scripts/(check-design|check-local-folders|note-screens|release-notes|install-release)\.sh$'
          # build-ipad builds the app target alone. test-app builds the same target and resources for the Mac, so a
          # resource that breaks the bundle fails there.
          build_ipad="$none|^app-tests/|$checks|^\.claude/|^app/resources/web/"
          test_app="$none|$checks|^\.claude/"
          # FolioPadTests compiles app-tests/ipad only.
          test_ipad="$none|$checks|^\.claude/|^app-tests/[^/]+$|^app-tests/(references|fixtures)/"
          needs() { if grep -qvE "$1" <<< "$files"; then echo true; else echo false; fi; }
          # test reads app/ and app-tests/ only for their Swift files (the design, Application Support and action
          # checks), which a pattern can't say without lookahead.
          if [ -n "$(grep -vE "$none|^(app|app-tests)/" <<< "$files" || true)" ] || grep -qE '^(app|app-tests)/.*\.swift$' <<< "$files"
          then test=true; else test=false; fi
          {
            echo "test=$test"
            echo "test-app=$(needs "$test_app")"
            echo "build-ipad=$(needs "$build_ipad")"
            echo "test-ipad=$(needs "$test_ipad")"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    needs: changes
    # A skipped job reports success to the ruleset. A failed `changes` leaves the output empty, which runs the job.
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      # Checkout stamps every file with the time it was written, so Xcode and SwiftPM, which compare a source's time
      # with the one their last build recorded, would compile everything the cache holds again. A time made from the
      # file's content (its blob hash) is the same on every runner while the content is, and a different one once it
      # changes, so a cached build skips exactly the unchanged files. Times stay in 2001-2010, never in the future.
      - name: Pin file times to content
        run: |
          git ls-files -s -z | perl -0ne 'my ($mode, $sha, $path) = /^(\d+) ([0-9a-f]+) \d+\t(.*)\0$/s or next; next unless $mode =~ /^100/; my $t = 1_000_000_000 + hex(substr($sha, 0, 7)); utime($t, $t, $path) or die "$path: $!"'
      - run: sudo ln -sfn "$XCODE" /Applications/Xcode.app
      # Apple's date detector reads 오후 3시 or 자정 only when Korean is a preferred language; on the English runner
      # it kept the date and dropped the time.
      - run: defaults write -g AppleLanguages -array ko-KR en-US && defaults write -g AppleLocale ko_KR
      - id: xcode
        run: echo "version=$(DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # Each package's build folder, saved the way the Xcode builds below are.
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            packages/*/.build
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('packages/*/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('packages/*/Package.resolved') }}-
            swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
      - uses: jdx/mise-action@v5
      - id: run
        run: mise run test
      # A failed test still built everything, so its build is worth keeping.
      - if: ${{ !cancelled() && (github.event_name == 'push' || steps.cache.outputs.cache-matched-key == '') && steps.run.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: |
            packages/*/.build
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: ${{ steps.cache.outputs.cache-primary-key }}

  build:
    needs: changes
    if: ${{ !cancelled() }}
    # A required check that a PR's files can't reach still has to report under its matrix name, which a job-level `if`
    # can't do (the matrix never expands). It runs on a Linux runner instead, with every step skipped.
    runs-on: ${{ needs.changes.outputs[matrix.task] == 'false' && 'ubuntu-latest' || 'xcode-27' }}
    # A test stuck on the main thread outlives its own time limit; without this the job would run for six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # test-app builds the Mac app to host the screen-model tests, so it stands in for build-mac. Its tests take five
        # minutes on one main thread, so two runners split them: the note-view suites and the rest. The test-app job
        # below reports both. test-ipad runs the iPad's own tests on a simulator.
        task: [test-app-notes, test-app-rest, build-ipad, test-ipad]
    env:
      RUN: ${{ needs.changes.outputs[matrix.task] != 'false' }}
      MISE_TASK: ${{ startsWith(matrix.task, 'test-app-') && 'test-app' || matrix.task }}
      FOLIO_TEST_PART: ${{ matrix.task == 'test-app-notes' && 'notes' || matrix.task == 'test-app-rest' && 'rest' || '' }}
      # Every other check builds Debug, so the iPad build goes Release: it also catches code that reaches what only
      # exists under #if DEBUG. It runs on PRs because macOS-only APIs broke main three times when it ran after merging.
      FOLIO_CONFIGURATION: ${{ matrix.task == 'build-ipad' && 'Release' || 'Debug' }}
      # The note-view references are this runner's pictures; on a new runner image the comparison fails rather than
      # quietly stopping. A missing or changed picture lands here and goes up as the note-screens artifact.
      FOLIO_NOTE_SCREENS_STRICT: 1
      FOLIO_NOTE_SCREENS: ${{ github.workspace }}/.build/note-screens
      FOLIO_XCODEBUILD_FLAGS: -skipPackageUpdates
    steps:
      - if: env.RUN != 'true'
        run: echo "No file in this PR reaches ${{ matrix.task }}."
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
      # Checkout stamps every file with the time it was written, so Xcode and SwiftPM, which compare a source's time
      # with the one their last build recorded, would compile everything the cache holds again. A time made from the
      # file's content (its blob hash) is the same on every runner while the content is, and a different one once it
      # changes, so a cached build skips exactly the unchanged files. Times stay in 2001-2010, never in the future.
      - if: env.RUN == 'true'
        name: Pin file times to content
        run: |
          git ls-files -s -z | perl -0ne 'my ($mode, $sha, $path) = /^(\d+) ([0-9a-f]+) \d+\t(.*)\0$/s or next; next unless $mode =~ /^100/; my $t = 1_000_000_000 + hex(substr($sha, 0, 7)); utime($t, $t, $path) or die "$path: $!"'
      - if: env.RUN == 'true'
        run: sudo ln -sfn "$XCODE" /Applications/Xcode.app
      - if: env.RUN == 'true'
        run: defaults write -g AppleLanguages -array ko-KR en-US && defaults write -g AppleLocale ko_KR
      - if: env.RUN == 'true'
        id: xcode
        run: echo "version=$(DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version | tr -s ' \n' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"
      # One cache per task: each builds another platform or configuration into its own DerivedData. The index, logs
      # and test results are rebuilt by every run and aren't worth the download. Each push to main saves a new cache,
      # which PRs start from; a PR saves only when it found none, so its pushes don't push main's out of the 10 GB.
      - if: env.RUN == 'true'
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/DerivedData
            !.build/DerivedData/Index.noindex
            !.build/DerivedData/Logs
            !.build/DerivedData/TestResults
            Folio.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: derived-data-${{ env.MISE_TASK }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('packages/*/Package.resolved', 'project.yml') }}-${{ github.sha }}
          restore-keys: |
            derived-data-${{ env.MISE_TASK }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('packages/*/Package.resolved', 'project.yml') }}-
            derived-data-${{ env.MISE_TASK }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
      # The app, test and resource bundles go so that a file the branch deleted can't linger in them; Xcode copies
      # resources into a bundle without removing old ones. Xcode also takes a source whose inode changed for an edited
      # one, and every file is new to this machine, so it is told to look at the times and sizes alone.
      - if: env.RUN == 'true'
        run: |
          rm -rf .build/DerivedData/Build/Products/*/*.app .build/DerivedData/Build/Products/*/*.xctest .build/DerivedData/Build/Products/*/*.bundle
          defaults write com.apple.dt.SWBBuildService IgnoreFileSystemDeviceInodeChanges -bool YES
      - if: env.RUN == 'true'
        uses: jdx/mise-action@v5
      - if: env.RUN == 'true'
        id: run
        run: mise run ${{ env.MISE_TASK }}
      # A run that failed to build would leave a cache without the dependencies; a failed test still saves, since the
      # app was built.
      - if: ${{ !cancelled() && env.RUN == 'true' && (github.event_name == 'push' || steps.cache.outputs.cache-matched-key == '') && (steps.run.outcome == 'success' || (steps.run.outcome == 'failure' && hashFiles('.build/DerivedData/Build/Products/*/Folio.app/**/Info.plist') != '')) }}
        id: keep
        run: du -sh .build/DerivedData/* || true
      - if: ${{ !cancelled() && steps.keep.outcome == 'success' }}
        uses: actions/cache/save@v6
        with:
          path: |
            .build/DerivedData
            !.build/DerivedData/Index.noindex
            !.build/DerivedData/Logs
            !.build/DerivedData/TestResults
            Folio.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            ~/Library/Caches/org.swift.swiftpm/manifests
          key: ${{ steps.cache.outputs.cache-primary-key }}
      # Sheets of pictures a test lays out for a PR (app-tests/note-render.swift), passing or not; not references.
      # NoteSourceTests lays them out, in the rest half; two uploads under one name would fail.
      - if: ${{ !cancelled() && env.RUN == 'true' && matrix.task == 'test-app-rest' }}
        uses: actions/upload-artifact@v7
        with:
          name: note-sheets
          path: .build/note-screens/sheets
          if-no-files-found: ignore
      # `mise run note-screens -- <run ID>` takes these as the new references, which only NoteScreenTests compares.
      - if: failure() && matrix.task == 'test-app-notes'
        uses: actions/upload-artifact@v7
        with:
          name: note-screens
          path: .build/note-screens
          if-no-files-found: ignore

  # The ruleset requires build (test-app), which the two halves above run between them; this reports both under that
  # name. It waits on Linux so it never holds one of the few macOS runners while a half is still queued for one: with
  # every runner taken by a job waiting on a half, no half could start.
  test-app:
    name: build (test-app)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - if: needs.changes.outputs.test-app != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100"
          halves='["build (test-app-notes)", "build (test-app-rest)"]'
          while :; do
            states=$(gh api "$jobs" --jq "[.jobs[] | select(.name as \$n | $halves | index(\$n))] | sort_by(.name)[] | \"\(.name): \(.status) \(.conclusion)\"") || states=
            [ "$(grep -c ': completed ' <<< "$states")" = 2 ] && break
            sleep 15
          done
          echo "$states"
          ! grep -v ': completed success$' <<< "$states"
