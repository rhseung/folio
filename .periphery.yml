project: Folio.xcodeproj
schemes:
  - Folio
# SwiftUI는 미리보기를, Codable은 coding key와 프로퍼티를, Objective-C 런타임은 @objc 멤버(메뉴 동작, KVO)를 이름으로
# 찾는다. 그래서 Swift에 부르는 곳이 없어도 안 쓰는 코드가 아니다.
retain_swift_ui_previews: true
retain_codable_properties: true
retain_objc_accessible: true
build_arguments:
  - -destination
  - platform=macOS
  - -derivedDataPath
  - .build/DerivedData
  - -skipMacroValidation
