<rect class="box" x="24" y="24" width="260" height="36" rx="4"/><text x="154.0" y="46.0" text-anchor="middle">Hall's theorem</text>
<rect class="box" x="24" y="104" width="260" height="36" rx="4"/><text x="154.0" y="126.0" text-anchor="middle">k-regular bipartite → perfect matching</text>
<rect class="box" x="24" y="184" width="260" height="36" rx="4"/><text x="154.0" y="206.0" text-anchor="middle">Petersen: 2k-regular → 2-factor</text>
<rect class="box" x="324" y="24" width="260" height="36" rx="4"/><text x="454.0" y="46.0" text-anchor="middle">κ, κ′ definitions</text>
<rect class="box" x="324" y="104" width="260" height="36" rx="4"/><text x="454.0" y="126.0" text-anchor="middle">Whitney: κ ≤ κ′ ≤ δ</text>
<rect class="box" x="324" y="184" width="260" height="36" rx="4"/><text x="454.0" y="206.0" text-anchor="middle">3-regular → κ = κ′</text>
<rect class="box" x="624" y="104" width="260" height="36" rx="4"/><text x="754.0" y="126.0" text-anchor="middle">2-connected ⇔ two internally disjoint paths</text>
<rect class="box" x="624" y="184" width="260" height="36" rx="4"/><text x="754.0" y="206.0" text-anchor="middle">2-connected: four conditions</text>
<rect class="box" x="624" y="264" width="260" height="36" rx="4"/><text x="754.0" y="286.0" text-anchor="middle">2-connected ⇔ ear decomposition</text>
<rect class="box" x="924" y="24" width="260" height="36" rx="4"/><text x="1054.0" y="46.0" text-anchor="middle">Max-flow min-cut</text>
<rect class="box" x="924" y="104" width="260" height="36" rx="4"/><text x="1054.0" y="126.0" text-anchor="middle">Menger, edge form: κ′(x,y) = λ′(x,y)</text>
<rect class="box" x="924" y="184" width="260" height="36" rx="4"/><text x="1054.0" y="206.0" text-anchor="middle">κ′(G) = max k with λ′(x,y) ≥ k</text>
<rect class="box" x="1224" y="24" width="260" height="36" rx="4"/><text x="1354.0" y="46.0" text-anchor="middle">Tutte: o(G−S) ≤ |S|</text>
<rect class="box" x="1224" y="104" width="260" height="36" rx="4"/><text x="1354.0" y="126.0" text-anchor="middle">Petersen: 3-regular, no cut-edge → 1-factor</text>
<rect class="box" x="1224" y="264" width="260" height="36" rx="4"/><text x="1354.0" y="286.0" text-anchor="middle">Menger: κ(x,y) = λ(x,y)</text>
<rect class="box" x="1524" y="24" width="260" height="36" rx="4"/><text x="1654.0" y="46.0" text-anchor="middle">Berge's theorem</text>
<rect class="box" x="1524" y="104" width="260" height="36" rx="4"/><text x="1654.0" y="126.0" text-anchor="middle">Augmenting path algorithm</text>
<rect class="box" x="1524" y="184" width="260" height="36" rx="4"/><text x="1654.0" y="206.0" text-anchor="middle">König–Egerváry: α′ = β</text>
<rect class="box" x="1524" y="264" width="260" height="36" rx="4"/><text x="1654.0" y="286.0" text-anchor="middle">Deleting an edge drops κ by at most 1</text>
</svg>
