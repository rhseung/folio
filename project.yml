name: Folio
options:
  bundleIdPrefix: com.rhseung
  developmentLanguage: ko
  # Keep in sync with platforms in Package.swift.
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # FolioTectonic.xcframework's macOS slice is arm64 only, so a universal Release build fails to link Tectonic.
    # Folio runs on Apple silicon Macs only (#41).
    "ARCHS[sdk=macosx*]": arm64
packages:
  # Every Folio module, in the Package.swift beside this file.
  Folio:
    path: .
  swift-algorithms:
    url: https://github.com/apple/swift-algorithms
    from: 1.2.0
  # WhisperKit: Whisper on the device, for transcribing a whole recording where Korean and English mix (#99).
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
targets:
  Folio:
    type: application
    supportedDestinations: [macOS, iOS]
    scheme:
      testTargets: [FolioTests]
    sources:
      - path: sources/app
        excludes: ["resources/AppIcon.icon", "resources/info.plist"]
      # An Icon Composer document; XcodeGen doesn't know the type, so it's named here or it lands as a plain folder.
      - path: sources/app/resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Folio
        product: FolioDomain
      - package: Folio
        product: FolioStorage
      - package: Folio
        product: FolioActions
      - package: Folio
        product: FolioIndex
      - package: Folio
        product: FolioLMS
      # Only the #if DEBUG previews use it (Workspace.scenario).
      - package: Folio
        product: FolioFixtures
      - package: Folio
        product: FolioMarkdown
      - package: Folio
        product: FolioAI
      - package: swift-algorithms
        product: Algorithms
      - package: ArgmaxOSS
        product: WhisperKit
    # MARKETING_VERSION and CURRENT_PROJECT_VERSION, which the generated Info.plist reads. `mise run generate` writes
    # it from FolioVersion and the commit count (scripts/version.sh), so a build is only as new as its last generate.
    configFiles:
      Debug: .build/version.xcconfig
      Release: .build/version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhseung.folio
        PRODUCT_NAME: Folio
        # Sign to Run Locally (no team). Set here, not at project level: XcodeGen's target preset
        # would override it with "iPhone Developer". Needs a team before running on a real iPad.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # The keys the build settings can't hold (the folio:// scheme), merged into the generated Info.plist.
        INFOPLIST_FILE: sources/app/resources/info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Folio
        INFOPLIST_KEY_NSFaceIDUsageDescription: 성적을 보기 전에 본인인지 확인합니다.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 강의를 녹음하고 받아쓰기 위해 마이크를 씁니다.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 녹음한 강의를 기기 안에서 글로 받아씁니다.
        # iPhone and iPad (#134). The iPhone keeps to portrait: its screens are laid out for 390pt across.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Keys added to Localizable.xcstrings by hand become `.key` symbols (Text(.peopleTitle)), checked at compile time.
        STRING_CATALOG_GENERATE_SYMBOLS: YES
  # Screen models and the note views on macOS (mise run test-app), and the iPad's edit view on an iPad simulator
  # (mise run test-ipad), run inside the app. Workspace skips the saved folder under tests. The Mac's files use AppKit and
  # the iPad's UIKit, so each folder builds for its own platform only.
  FolioTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: tests/unit/app
        excludes: ["ipad"]
        destinationFilters: [macOS]
      - path: tests/unit/app/ipad
        destinationFilters: [iOS]
    dependencies:
      # FolioFixtures comes through the app it is hosted in; linking it here too would load a second copy.
      - target: Folio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TARGETED_DEVICE_FAMILY: "2"
        # XcodeGen points a multiplatform app's host at the iOS layout; the Mac app keeps its binary in Contents/MacOS.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Folio.app/Folio
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Folio.app/Contents/MacOS/Folio
        BUNDLE_LOADER: $(TEST_HOST)
  # The accessibility audit of the main screens (#471, mise run test-a11y). A UI test drives the app from a runner
  # process of its own, so it links the fixtures it writes the app's folder with; nothing loads them twice.
  FolioE2ETests:
    type: bundle.ui-testing
    supportedDestinations: [macOS]
    sources: [tests/e2e/app]
    dependencies:
      - target: Folio
      - package: Folio
        product: FolioFixtures
      - package: Folio
        product: FolioStorage
      - package: Folio
        product: FolioDomain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Folio
schemes:
  # Its own scheme, apart from Folio's: a UI test takes the screen and keyboard, so ⌘U and mise run test-app must not
  # start it on a Mac someone is using. CI runs it.
  FolioE2ETests:
    build:
      targets:
        Folio: all
        FolioE2ETests: [test]
    test:
      targets: [FolioE2ETests]
