name: Folio
options:
  bundleIdPrefix: com.rhseung
  developmentLanguage: ko
  # Keep in sync with platforms in every packages/*/Package.swift.
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  FolioCore:
    path: packages/folio-core
  FolioMarkdown:
    path: packages/folio-markdown
  FolioAI:
    path: packages/folio-ai
  swift-algorithms:
    url: https://github.com/apple/swift-algorithms
    from: 1.2.0
  # WhisperKit: Whisper on the device, for transcribing a whole recording where Korean and English mix (#99).
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
targets:
  Folio:
    type: application
    supportedDestinations: [macOS, iOS]
    scheme:
      testTargets: [FolioTests]
    sources:
      - path: app
        excludes: ["resources/AppIcon.icon", "resources/info.plist"]
      # An Icon Composer document; XcodeGen doesn't know the type, so it's named here or it lands as a plain folder.
      - path: app/resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: FolioCore
        product: FolioDomain
      - package: FolioCore
        product: FolioStorage
      - package: FolioCore
        product: FolioActions
      - package: FolioCore
        product: FolioIndex
      # Only the #if DEBUG previews use it (Workspace.scenario).
      - package: FolioCore
        product: FolioFixtures
      - package: FolioMarkdown
      - package: FolioAI
      - package: swift-algorithms
        product: Algorithms
      - package: ArgmaxOSS
        product: WhisperKit
    # MARKETING_VERSION and CURRENT_PROJECT_VERSION, which the generated Info.plist reads. `mise run generate` writes
    # it from FolioVersion and the commit count (scripts/version.sh), so a build is only as new as its last generate.
    configFiles:
      Debug: .build/version.xcconfig
      Release: .build/version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhseung.folio
        PRODUCT_NAME: Folio
        # Sign to Run Locally (no team). Set here, not at project level: XcodeGen's target preset
        # would override it with "iPhone Developer". Needs a team before running on a real iPad.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # The keys the build settings can't hold (the folio:// scheme), merged into the generated Info.plist.
        INFOPLIST_FILE: app/resources/info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Folio
        INFOPLIST_KEY_NSFaceIDUsageDescription: 성적을 보기 전에 본인인지 확인합니다.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 강의를 녹음하고 받아쓰기 위해 마이크를 씁니다.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 녹음한 강의를 기기 안에서 글로 받아씁니다.
        # iPad only; the spec targets macOS and iPadOS, not iPhone.
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        # Keys added to Localizable.xcstrings by hand become `.key` symbols (Text(.peopleTitle)), checked at compile time.
        STRING_CATALOG_GENERATE_SYMBOLS: YES
  # Screen models, run inside the app on macOS (mise run test-app). Workspace skips the saved folder under tests.
  FolioTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources: [app-tests]
    dependencies:
      # FolioFixtures comes through the app it is hosted in; linking it here too would load a second copy.
      - target: Folio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        # XcodeGen points a multiplatform app's host at the iOS layout; the Mac app keeps its binary in Contents/MacOS.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Folio.app/Contents/MacOS/Folio
        BUNDLE_LOADER: $(TEST_HOST)
  # Hangul typed into the iPad's edit view, run inside the app on an iPad simulator (mise run test-ipad). The Mac's
  # note-view checks are in FolioTests, which builds these files to nothing (#if os(iOS)).
  FolioPadTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources: [app-tests/ipad]
    dependencies:
      - target: Folio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Folio.app/Folio
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  # Its own scheme: in Folio's, a Mac test run would also try to run these iOS-only tests.
  FolioPad:
    build:
      targets:
        Folio: all
        FolioPadTests: [test]
    test:
      targets: [FolioPadTests]
