name: Folio
options:
  bundleIdPrefix: com.rhseung
  developmentLanguage: ko
  # Package.swift의 platforms와 함께 고친다.
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # FolioTectonic.xcframework의 macOS slice는 arm64뿐이라, universal Release 빌드는 Tectonic을 링크하지 못한다.
    "ARCHS[sdk=macosx*]": arm64
packages:
  Folio:
    path: .
  swift-algorithms:
    url: https://github.com/apple/swift-algorithms
    from: 1.2.0
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.1
targets:
  Folio:
    type: application
    supportedDestinations: [macOS, iOS]
    scheme:
      testTargets: [FolioTests]
    sources:
      - path: sources/app
        excludes: ["resources/AppIcon.icon", "resources/info.plist"]
      # XcodeGen은 Icon Composer 문서의 형식을 모르므로, 여기서 따로 지정하지 않으면 보통 폴더로 들어간다.
      - path: sources/app/resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: Folio
        product: FolioDomain
      - package: Folio
        product: FolioStorage
      - package: Folio
        product: FolioActions
      - package: Folio
        product: FolioIndex
      - package: Folio
        product: FolioLMS
      - package: Folio
        product: FolioFixtures
      - package: Folio
        product: FolioMarkdown
      - package: Folio
        product: FolioAI
      - package: swift-algorithms
        product: Algorithms
      - package: ArgmaxOSS
        product: WhisperKit
    configFiles:
      Debug: .build/version.xcconfig
      Release: .build/version.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhseung.folio
        PRODUCT_NAME: Folio
        # Sign to Run Locally(팀 없음)로 서명한다. 프로젝트 수준에 두면 XcodeGen의 타깃 preset이 "iPhone Developer"로
        # 덮어쓰므로 여기에 둔다. 실제 iPad에서 실행하려면 팀이 필요하다.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        # 빌드 설정으로 쓸 수 없는 키(folio:// scheme)는 이 파일에 두고, 생성한 Info.plist에 합친다.
        INFOPLIST_FILE: sources/app/resources/info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Folio
        INFOPLIST_KEY_NSFaceIDUsageDescription: 성적을 보기 전에 본인인지 확인합니다.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 강의를 녹음하고 받아쓰기 위해 마이크를 씁니다.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 녹음한 강의를 기기 안에서 글로 받아씁니다.
        # iPhone 화면은 폭 390pt에 맞춰 배치했으므로 iPhone은 세로 방향만 지원한다.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
  # Mac 테스트 파일은 AppKit을, iPad 테스트 파일은 UIKit을 쓰므로 폴더마다 자기 플랫폼에서만 빌드한다.
  FolioTests:
    type: bundle.unit-test
    supportedDestinations: [macOS, iOS]
    sources:
      - path: tests/unit/app
        excludes: ["ipad"]
        destinationFilters: [macOS]
      - path: tests/unit/app/ipad
        destinationFilters: [iOS]
    dependencies:
      # FolioFixtures는 호스트 앱을 거쳐 들어오므로, 여기서도 링크하면 두 번째 사본이 로드된다.
      - target: Folio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TARGETED_DEVICE_FAMILY: "2"
        # XcodeGen은 멀티플랫폼 앱의 호스트를 iOS 배치로 가리키는데, Mac 앱은 실행 파일을 Contents/MacOS에 둔다.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Folio.app/Folio
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Folio.app/Contents/MacOS/Folio
        BUNDLE_LOADER: $(TEST_HOST)
  # UI 테스트는 앱과 다른 러너 프로세스에서 돌므로, 앱의 폴더를 쓰는 데 필요한 픽스처를 직접 링크해도 두 번 로드되지 않는다.
  FolioE2ETests:
    type: bundle.ui-testing
    supportedDestinations: [macOS]
    sources: [tests/e2e/app]
    dependencies:
      - target: Folio
      - package: Folio
        product: FolioFixtures
      - package: Folio
        product: FolioStorage
      - package: Folio
        product: FolioDomain
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Folio
schemes:
  # UI 테스트는 화면과 키보드를 가져가므로, 사용 중인 Mac에서 ⌘U나 mise run test-app이 시작하지 않도록 Folio와 다른 scheme에 둔다.
  FolioE2ETests:
    build:
      targets:
        Folio: all
        FolioE2ETests: [test]
    test:
      targets: [FolioE2ETests]
