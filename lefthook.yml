pre-commit:
  # SwiftLint가 swift-format이 고친 파일을 읽어야 하므로 차례대로 실행한다.
  piped: true
  commands:
    swift-format:
      priority: 1
      glob: "*.swift"
      run: mise exec -- scripts/swift-format.sh format {staged_files}
      stage_fixed: true
    swiftlint:
      priority: 2
      glob: "*.swift"
      run: mise exec -- swiftlint lint --quiet --strict --force-exclude --baseline .swiftlint-baseline.json {staged_files}
    folio-lint:
      priority: 3
      glob: "*.swift"
      # app-direction 같은 규칙은 모든 파일이 필요하므로 바뀐 파일만 넘기지 않는다. 빌드한 뒤에는 전체를 읽는 데 2초쯤 걸린다.
      run: mise run check-code
    shell-check:
      priority: 4
      glob: "{*.sh,.mise/tasks/*}"
      run: mise run shell-check
