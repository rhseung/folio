# 레이아웃은 swift-format이 맡으므로 레이아웃 규칙은 여기서 끈다.
included:
  - sources
  - tests
excluded:
  # 생성기의 출력이다(scripts/swift-format.sh의 `generated`와 같은 폴더).
  - "sources/**/generated"
  - sources/web
  - sources/tectonic
  - "**/.build"

disabled_rules:
  - line_length
  - trailing_comma
  - opening_brace
  - vertical_whitespace
  - trailing_whitespace
  - trailing_newline
  - statement_position
  - switch_case_alignment
  - vertical_parameter_alignment
  # swift-format은 호출이 줄을 채우면 클로저의 매개변수를 다음 줄로 옮긴다.
  - closure_parameter_position
  # 아래 다섯 규칙은 메시지에 지금 개수(`currently spans 632 lines`)를 넣는데, 기준선은 메시지로 위반을 맞춘다. 그래서 긴
  # 파일에 한 줄만 더하거나 빼도 새 위반이 된다.
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count

opt_in_rules:
  - private_swiftui_state
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - contains_over_filter_count
  - first_where
  - last_where
  - sorted_first_last
  - reduce_into
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - unhandled_throwing_task
  - async_without_await

analyzer_rules:
  - unused_import
  - unused_declaration

# `id`, `x`, 비교 함수의 `a`와 `b`처럼 한 글자로도 뜻이 분명한 이름을 허용한다.
identifier_name:
  min_length: 1
  max_length: 60
# 테스트의 한 글자 별칭(`typealias V = ...`)은 검사하는 타입을 가리키므로 허용한다.
type_name:
  min_length: 1
  max_length: 60
