[package]
name = "folio_tectonic"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
tectonic = { path = "../tectonic", default-features = false, features = ["geturl-reqwest"] }
tectonic_bundles = { path = "../tectonic/crates/bundles", default-features = false, features = ["geturl-reqwest"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[workspace]
